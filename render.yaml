services:
  - type: web
    name: adepapay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build
    startCommand: gunicorn --config gunicorn.conf.py backend.wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: info@adepapay.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIRESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: SEO_INDEXING
        value: "false"
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_IMAGES_TOKEN
        sync: false
      - key: CF_HASH
        sync: false
      - key: CF_IMAGES_VARIANT
        value: public
